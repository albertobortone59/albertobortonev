<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎡 Ruota Panoramica</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruota">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3250;
    --accent:#4f8ef7;--green:#2ecc71;--orange:#f39c12;--red:#e74c3c;
    --text:#e8eaf0;--muted:#6b7199;
  }
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;flex-direction:column;}

  /* HEADER */
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:5px 8px;display:flex;align-items:center;gap:5px;flex-shrink:0;flex-wrap:wrap;}
  header .logo{font-size:16px;}
  .sg{display:flex;align-items:center;gap:3px;}
  .sg label{font-size:10px;color:var(--muted);}
  .sg input{background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px;font-weight:700;width:38px;padding:3px;text-align:center;}
  .sg input:focus{outline:none;border-color:var(--accent);}
  .abtn{background:var(--surface2);border:1px solid var(--border);color:var(--accent);border-radius:5px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;}
  .abtn:active{background:var(--accent);color:#fff;}
  .sinfo{font-size:10px;color:var(--accent);font-weight:600;}
  .reset-btn{background:#2a2a2a;border:1px solid #555;color:#f39c12;border-radius:5px;padding:4px 7px;font-size:10px;font-weight:700;cursor:pointer;margin-left:auto;}

  /* --- PANNELLO RILEVAMENTO AUTOMATICO (FOTOCAMERA) --- */
  .cam-toggle-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;}
  .cam-toggle-btn.active{border-color:var(--accent);color:var(--accent);}
  .cam-panel{
    position:fixed;inset:0;z-index:600;background:var(--bg);
    padding:10px 12px;overflow-y:auto;
    display:flex;flex-direction:column;
    visibility:hidden;opacity:0;pointer-events:none;
  }
  .cam-panel.open{
    visibility:visible;opacity:1;pointer-events:auto;
  }
  .cam-header-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-shrink:0;}
  .cam-header-row span{font-weight:800;font-size:14px;}
  .cam-done-btn{background:var(--green);border:none;color:#fff;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:800;cursor:pointer;}
  .cam-stage{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:10px;overflow:hidden;flex-shrink:0;}
  .cam-stage video{width:100%;height:100%;object-fit:cover;display:block;}
  .cam-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .cam-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:0 20px;}
  .cam-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .cam-btn{flex:1;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer;min-width:120px;}
  .cam-btn.on{background:var(--surface2);color:var(--red);border:1px solid var(--red);}
  .cam-status{display:flex;gap:8px;margin-top:8px;}
  .cam-card{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;}
  .cam-card .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .cam-card .v{font-size:15px;font-weight:800;margin-top:2px;display:flex;align-items:center;gap:6px;}
  .cam-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0;}
  .cam-dot.libero{background:var(--accent);box-shadow:0 0 8px var(--accent);}
  .cam-dot.occupato{background:var(--red);box-shadow:0 0 8px var(--red);}
  .cam-mini{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .cam-mini label{color:var(--text);}
  .cam-mini input[type=number]{width:46px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 5px;font-size:12px;}
  .cam-mini input[type=range]{width:90px;vertical-align:middle;accent-color:var(--accent);}
  .cam-auto-row{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;}
  .cam-auto-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);}
  .cam-auto-row .lab{font-size:12.5px;font-weight:600;}
  .cam-auto-row .sub{font-size:10.5px;color:var(--muted);}
  .cam-counter{display:flex;gap:8px;margin-top:8px;}
  .cam-counter .cam-card{text-align:center;}
  .cam-counter .v{font-size:22px;justify-content:center;}
  .reset-btn:active{background:var(--red);color:#fff;}

  /* RUOTA WIDGET */
  .wheel-wrap{
    flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);
    display:flex;justify-content:center;align-items:center;
    padding:6px;cursor:pointer;
    transition:all .3s ease;
    position:relative;
  }
  .wheel-wrap.mini{height:130px;}
  .wheel-wrap.full{
    position:fixed;inset:0;z-index:500;background:rgba(10,10,15,.96);
    height:auto;padding:20px;
  }
  .wheel-wrap canvas{display:block;}
  .wheel-hint{
    position:absolute;bottom:4px;right:6px;
    font-size:9px;color:var(--muted);pointer-events:none;
  }
  .wheel-wrap.full .wheel-overlay{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;align-items:center;z-index:10;
  }
  .wheel-wrap.mini .wheel-overlay{display:none;}
  .wheel-cam-bar{display:none;}
  .wheel-wrap.full .wheel-cam-bar{
    display:flex;position:absolute;top:14px;left:50%;transform:translateX(-50%);
    gap:10px;align-items:center;z-index:10;background:rgba(20,22,35,.85);
    border:1px solid var(--border);border-radius:10px;padding:7px 12px;
  }
  .wheel-cam-info{display:flex;flex-direction:column;line-height:1.15;}
  .wheel-cam-info .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .wheel-cam-info .v{font-size:16px;font-weight:900;color:#00e5ff;}
  .wheel-cam-btn{border:2px solid #555;border-radius:8px;background:#2a2a2a;color:var(--muted);
    font-size:12px;font-weight:800;padding:7px 10px;cursor:pointer;white-space:nowrap;}
  .wheel-cam-btn.active{background:#003344;border-color:#00e5ff;color:#00e5ff;}
  .wheel-cam-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-left:6px;vertical-align:middle;}
  .wheel-cam-dot.libero{background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .wheel-cam-dot.occupato{background:var(--red);box-shadow:0 0 6px var(--red);}
  .wheel-cam-calib-btn{border:2px solid #555;border-radius:8px;background:#2a2a2a;color:var(--muted);
    font-size:14px;font-weight:800;padding:7px 9px;cursor:pointer;}
  .wheel-cam-calib-btn.active{background:#003344;border-color:#00e5ff;color:#00e5ff;}
  .cam-toast{
    display:none;position:absolute;left:50%;bottom:64px;transform:translateX(-50%);
    background:#006677;color:#fff;font-weight:700;font-size:12.5px;
    padding:7px 14px;border-radius:9px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:15;
  }
  .wheel-wrap.full .cam-toast{display:block;}
  .cam-toast.show{opacity:1;}
  .wheel-big-btn{
    padding:7px 18px;border:none;border-radius:8px;
    font-size:13px;font-weight:900;cursor:pointer;white-space:nowrap;
  }
  .wheel-big-btn.running{background:var(--green);color:#fff;}
  .wheel-big-btn.paused{background:var(--orange);color:#fff;}
  .wheel-big-btn:active{opacity:.8;}
  .wheel-sync-btn{
    padding:7px 14px;border:2px solid #555;border-radius:8px;
    background:#2a2a2a;color:#f39c12;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;
  }
  .wheel-sync-btn.active{background:#003344;border-color:#00e5ff;color:#00e5ff;}
  .wheel-sync-btn:active{opacity:.75;}

  /* GRIGLIA */
  .grid-wrap{flex:1;overflow-y:auto;padding:2px 1px 2px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;}

  /* CARD */
  .card-top{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;}
  .cn{font-size:24px;font-weight:900;line-height:1;color:#fff;}
  .cl{font-size:17px;font-weight:900;line-height:1;}
  .ct{font-size:14px;font-weight:700;line-height:1;}
  .card{
    background:var(--surface);border:2px solid var(--border);border-radius:6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;cursor:pointer;user-select:none;position:relative;
    min-height:70px;transition:border-color .15s,background .15s;padding:3px 1px;
  }
  .plus-btn{
    width:26px;height:26px;border-radius:5px;border:none;font-size:18px;font-weight:900;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
    background:rgba(255,255,255,.15);color:#fff;opacity:0;pointer-events:none;
  }
  .card.run .plus-btn{opacity:1;pointer-events:auto;background:rgba(46,204,113,.3);}
  .card.run .plus-btn:active{background:rgba(46,204,113,.7);}
  .card.run .plus-btn.used{opacity:.25;pointer-events:none;}
  .card.warn .plus-btn{opacity:1;pointer-events:auto;background:rgba(255,255,255,.15);}
  .card.warn .plus-btn:active{background:rgba(255,255,255,.4);}
  .card.warn .plus-btn.used{opacity:.25;pointer-events:none;}

  .card.sel{border-color:var(--accent);background:#0d1a38;}
  .card.sel .cl,.card.sel .ct{color:var(--accent);}
  .card.run{border-color:var(--green);background:#0a1f12;}
  .card.run .cn{color:#fff;}
  .card.run .cl,.card.run .ct{color:var(--green);}
  .card.pau{border-color:var(--orange);background:#1f1400;}
  .card.pau .cn{color:var(--orange);}
  .card.pau .cl,.card.pau .ct{color:var(--orange);}
  .card.new{border-color:var(--accent);background:#0d1a38;}
  .card.new .cl,.card.new .ct{color:var(--accent);}
  .card.excl{border-color:#e6c200;background:#211c00;}
  .card.excl .cn{color:#e6c200;}
  .card.excl .ct{color:#e6c200;}
  .card.warn{border-color:#ff2200;animation:flash .45s ease-in-out infinite alternate;}
  .card.warn .cn{color:#ff3300;}
  .card.warn .cl,.card.warn .ct{color:#ff3300;}
  @keyframes flash{
    from{background:#0a1f12;box-shadow:0 0 4px rgba(255,34,0,.2);}
    to  {background:#2d0800;box-shadow:0 0 22px rgba(255,34,0,.7);}
  }
  .card.off{opacity:.18;pointer-events:none;border-color:var(--border);}
  .card.off .cn{color:var(--muted);}
  .card.sync-target{border-color:#00e5ff;animation:syncPulse .5s ease-in-out infinite alternate;}
  .card.sync-target .plus-btn{opacity:.15;}
  @keyframes syncPulse{
    from{box-shadow:0 0 4px rgba(0,229,255,.2);}
    to  {box-shadow:0 0 20px rgba(0,229,255,.7);}
  }

  /* BOTTOM */
  .bottom{flex-shrink:0;padding:5px 8px;display:flex;flex-direction:column;gap:5px;}
  .sync-row{display:flex;align-items:center;gap:8px;}
  .sync-btn{flex:1;padding:10px;border:2px solid #555;border-radius:9px;background:#2a2a2a;color:#f39c12;font-size:13px;font-weight:800;cursor:pointer;transition:all .2s;}
  .sync-btn.active{background:#003344;border-color:#00e5ff;color:#00e5ff;animation:syncBtnPulse .6s ease-in-out infinite alternate;}
  @keyframes syncBtnPulse{from{box-shadow:0 0 4px rgba(0,229,255,.2);}to{box-shadow:0 0 16px rgba(0,229,255,.6);}}
  .sync-btn:active{opacity:.75;}
  .sync-countdown{font-size:20px;font-weight:900;color:#00e5ff;width:28px;text-align:center;display:none;}
  .sync-countdown.on{display:block;}
  .big{width:100%;padding:14px;border:none;border-radius:11px;font-size:18px;font-weight:900;cursor:pointer;transition:background .2s;}
  .big.running{background:var(--green);color:#fff;}
  .big.paused{background:var(--orange);color:#fff;}
  .big:active{opacity:.8;transform:scale(.98);}

  /* TOAST */
  #toasts{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;}
  .toast{background:#333;color:#fff;font-weight:700;font-size:13px;padding:8px 16px;border-radius:9px;box-shadow:0 4px 18px rgba(0,0,0,.4);animation:su .25s ease;white-space:nowrap;}
  .toast.g{background:var(--green);}
  .toast.c{background:#006677;}
  @keyframes su{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* SCHERMATA DI APERTURA */
  #splashScreen{
    position:fixed;inset:0;z-index:9999;background:#000;
    display:flex;align-items:center;justify-content:center;
    opacity:1;transition:opacity 1s ease;
  }
  #splashScreen img{width:100%;height:100%;object-fit:cover;display:block;}
  #splashScreen.fade-out{opacity:0;pointer-events:none;}
</style>
</head>
